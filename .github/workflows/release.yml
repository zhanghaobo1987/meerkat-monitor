name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,  goarch: amd64, ext: "" }
          - { goos: linux,  goarch: arm64, ext: "" }
          - { goos: linux,  goarch: arm,   ext: "" }
          - { goos: darwin, goarch: amd64, ext: "" }
          - { goos: darwin, goarch: arm64, ext: "" }
          - { goos: windows, goarch: amd64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Embed install script
        run: |
          mkdir -p internal/server/web_dist
          cp -f install.sh internal/server/web_dist/install.sh

      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o "output/meerkat_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}" .

      - name: Package (unix)
        if: matrix.goos != 'windows'
        run: |
          cd output
          tar -czf "meerkat_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" "meerkat_${{ matrix.goos }}_${{ matrix.goarch }}"
          sha256sum "meerkat_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" > "meerkat_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz.sha256"

      - name: Package (windows)
        if: matrix.goos == 'windows'
        run: |
          cd output
          zip -q "meerkat_${{ matrix.goos }}_${{ matrix.goarch }}.zip" "meerkat_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}"
          sha256sum "meerkat_${{ matrix.goos }}_${{ matrix.goarch }}.zip" > "meerkat_${{ matrix.goos }}_${{ matrix.goarch }}.zip.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: output/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
