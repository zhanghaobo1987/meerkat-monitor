name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Embed install script
        run: |
          mkdir -p internal/server/web_dist
          cp -f install.sh internal/server/web_dist/install.sh
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
